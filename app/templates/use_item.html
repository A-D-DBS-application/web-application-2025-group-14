{% extends "base.html" %}
{% block body_class %}has-overlay{% endblock %}

{% block title %}Reserve item{% endblock %}

{% block content %}
{# Background inventory content - blurred #}
<div id="inventory-background" style="position: fixed; inset: 0; z-index: 1; filter: blur(4px); pointer-events: none; overflow: hidden; background: #f8fafc;">
    <iframe src="{{ url_for('main.inventory', brand=request.args.get('brand'), material_id=request.args.get('material_id')) }}" 
            style="width: 100%; height: 100%; border: none; transform: scale(1.02); transform-origin: top left;"></iframe>
</div>

<div class="return-modal is-open" style="position: fixed; inset: 0; z-index: 1200;">
    <div class="return-backdrop" onclick="window.location.href='{{ url_for('main.inventory', brand=request.args.get('brand'), material_id=request.args.get('material_id')) }}'"></div>
    <div class="return-dialog" style="position: relative; z-index: 1201;">
        <div class="modal-header">
            <h2>Reserve item</h2>
            <a href="{{ url_for('main.inventory', brand=request.args.get('brand'), material_id=request.args.get('material_id')) }}" class="modal-close">×</a>
        </div>
        <div class="modal-body">
            {% include "use_item_partial.html" %}
        </div>
    </div>
</div>
{% endblock %}
