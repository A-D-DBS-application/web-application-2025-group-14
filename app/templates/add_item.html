{% extends "base.html" %}
{% block body_class %}no-sidebar{% endblock %}


{% block title %}Add inventory item{% endblock %}

{% block content %}
<div class="form-page">
    <h1 class="page-title">Add inventory item</h1>

    <form method="post" class="form-card form-card-wide">
        <!-- ===== MATERIAL ===== -->
        <section class="form-section">
            <h2 class="section-title">Material</h2>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="brand">Brand</label>
                    <input type="text" id="brand" name="brand" required>
                    <div id="brand_suggestions" 
                         style="color:#666; font-size:0.9em; margin-top:4px;"></div>
                </div>

                <div class="form-group">
                    <label for="material_type">Type</label>
                    <input type="text" id="material_type" name="material_type" required>
                </div>

                <div class="form-group full-width">
                    <label for="description">Description</label>
                    <input type="text" class="form-control" id="description" name="description" required>
                </div>

                <div class="form-group">
                    <label for="price">Price (€)</label>
                    <input type="text" id="price" name="price" placeholder="e.g. 12.50">
                </div>

                <div class="form-group">
                    <label for="lifecycle">Lifecycle</label>
                    <input type="text" id="lifecycle" name="lifecycle" placeholder="e.g. Active, Obsolete…">
                </div>
            </div>
        </section>

        <!-- ===== INVENTORY ITEM ===== -->
        <section class="form-section">
            <h2 class="section-title">Inventory item</h2>

            <div class="form-grid-2">
                <!-- eerst Quantity, dan Zone zoals je vroeg -->
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" min="0" required>
                </div>

                <div class="form-group">
                    <label for="zone_name">Zone</label>
                    <input type="text" id="zone_name" name="zone_name" maxlength="3" placeholder="e.g. 26B" required>
                </div>

                <div class="form-group">
                    <label for="purpose">Purpose</label>
                    <select id="purpose" name="purpose" required>
                        <option value="keep">keep</option>
                        <option value="sell">sell</option>
                        <option value="dispose">dispose</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="packaging">Packaging</label>
                    <select id="packaging" name="packaging" required>
                        <option value="open">open</option>
                        <option value="closed">closed</option>
                        <option value="none">none</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="comment">Comment</label>
                    <textarea id="comment" name="comment" rows="1" class="compact-text"></textarea>
                </div>
            </div>
        </section>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Add item</button>
            <a href="{{ url_for('main.inventory') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Add a style tag for the autofill class
    const style = document.createElement('style');
    style.innerHTML = `.autofilled { background-color: #f2f2f2 !important; }`;
    document.head.appendChild(style);
});

document.addEventListener("DOMContentLoaded", function() {
    // --- BRAND SUGGESTIONS ---
    const brandInput = document.getElementById("brand");
    const brandSuggestionsBox = document.getElementById("brand_suggestions");

    brandInput.addEventListener("input", function () {
        const q = this.value.trim();

        if (q.length === 0) {
            brandSuggestionsBox.innerHTML = "";
            return;
        }

        fetch(`/brand_suggest?q=${encodeURIComponent(q)}`)
            .then(r => r.json())
            .then(data => {
                if (!data.suggestions.length) {
                    brandSuggestionsBox.innerHTML = "";
                    return;
                }

                brandSuggestionsBox.innerHTML = data.suggestions
                    .map(s => `<div class="suggestion" style="cursor:pointer; padding: 2px 0;">${s}</div>`)
                    .join("");

                document.querySelectorAll(".suggestion").forEach(el => {
                    el.onclick = () => {
                        brandInput.value = el.textContent;
                        brandSuggestionsBox.innerHTML = "";
                        // Manually trigger an 'input' event so other listeners react
                        brandInput.dispatchEvent(new Event('input', { bubbles: true }));
                    };
                });
            });
    });

    // --- AUTO-FILL MATERIAL DETAILS ---
    const typeInput = document.getElementById('material_type');
    const descInput = document.getElementById('description');
    const priceInput = document.getElementById('price');
    const lifecycleInput = document.getElementById('lifecycle');
    const commentInput = document.getElementById('comment');

    const materialAutofillElements = [descInput, priceInput, lifecycleInput];
    const itemAutofillElements = [commentInput];



    function setAutofilled(element, value) {
        if (element.value !== value) {
            element.value = value;
        }
        element.classList.add('autofilled');
        
        // Add a one-time listener to remove the style on user input
        element.addEventListener('input', function onFirstInput() {
            element.classList.remove('autofilled');
            element.removeEventListener('input', onFirstInput);
        }, { once: true });
    }

    function clearAutofilled(elements) {
        elements.forEach(el => {
            // Only clear if it was previously autofilled and not yet touched by the user
            if (el.classList.contains('autofilled')) {
                el.value = '';
                el.classList.remove('autofilled');
            }
        });
    }

    async function fetchMaterialDetails() {
        const brand = brandInput.value.trim();
        const type = typeInput.value.trim();

        if (!brand || !type) {
            return; // Do nothing if one of the fields is empty
        }

        try {
            const response = await fetch(`/material_details?brand=${encodeURIComponent(brand)}&type=${encodeURIComponent(type)}`);
            if (!response.ok) return;

            const data = await response.json();

            // Only fill if data is returned and has a description
            if (data && data.description) {
                setAutofilled(descInput, data.description || '');
                setAutofilled(priceInput, data.price || '');
                setAutofilled(lifecycleInput, data.lifecycle || '');
            } else {
                // If no data is returned, clear any previously autofilled material fields
                clearAutofilled(materialAutofillElements);
            }
        } catch (error) {
            console.error('Error fetching material details:', error);
        }
    }

    // Add event listeners to trigger the fetch
    brandInput.addEventListener('input', fetchMaterialDetails);
    typeInput.addEventListener('input', fetchMaterialDetails);

    // --- AUTO-FILL ITEM COMMENT ---
    const zoneInput = document.getElementById('zone_name');
    const purposeInput = document.getElementById('purpose');
    const packagingInput = document.getElementById('packaging');

    async function fetchItemDetails() {
        const brand = brandInput.value.trim();
        const type = typeInput.value.trim();
        const zone = zoneInput.value.trim();
        const purpose = purposeInput.value;
        const packaging = packagingInput.value;

        if (!brand || !type || !zone || !purpose || !packaging) {
            return;
        }

        const params = new URLSearchParams({ brand, type, zone, purpose, packaging });
        try {
            const response = await fetch(`/item_details?${params.toString()}`);
            if (!response.ok) return;
            const data = await response.json();
            if (data && data.comment) {
                setAutofilled(commentInput, data.comment);
            } else {
                // If no data is returned, clear the comment field if it was autofilled
                clearAutofilled(itemAutofillElements);
            }
        } catch (error) {
            console.error('Error fetching item details:', error);
        }
    }

    // Add event listeners for item details
    brandInput.addEventListener('input', fetchItemDetails);
    typeInput.addEventListener('input', fetchItemDetails);
    zoneInput.addEventListener('input', fetchItemDetails);
    purposeInput.addEventListener('change', fetchItemDetails);
    packagingInput.addEventListener('change', fetchItemDetails);
});
</script>

{% endblock %}
