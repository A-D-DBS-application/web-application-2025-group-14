<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Inventory{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top-header">
    <div class="top-header-inner">
        <div class="top-header-left">
            Logged in as <strong>{{ session.username }}</strong>
        </div>

        <div class="top-header-center">
            <span class="company">{{ session.company_name }}</span>
        </div>

        <div class="top-header-right">
            <button type="button" class="icon-btn top-icon" data-panel-open="filter-panel">🔍</button>
            <a href="{{ url_for('main.add_item') }}" class="icon-btn top-icon">＋</a>
            <button type="button" class="icon-btn top-icon" data-panel-open="reservations-panel">🛒</button>
        </div>
    </div>
</header>

<div class="app-shell">
    <aside class="sidebar {% if body_class == 'no-sidebar' %}hidden{% endif %}">
        <div class="sidebar-header">
            <h2>Brands</h2>
            <p class="sidebar-subtitle">
            </p>
        </div>

        {% block sidebar %}{% endblock %}
    </aside>

    <main class="main">
        <header class="main-header">
            {% block header %}{% endblock %}
        </header>

        <section class="main-content">
            {% block content %}{% endblock %}
        </section>
    </main>
</div>

<script>
document.addEventListener('click', function (event) {
    // Toggle details
    const toggle = event.target.closest('[data-toggle-details]');
    if (toggle) {
        const id = toggle.getAttribute('data-toggle-details');
        const panel = document.getElementById(id);
        if (panel) {
            panel.classList.toggle('open');
            toggle.textContent = panel.classList.contains('open') ? 'Less details' : 'More details';
        }
    }

    // Open modal (per-item reservations, use-item, etc.)
    const openModalBtn = event.target.closest('[data-modal-target]');
    if (openModalBtn) {
        const targetId = openModalBtn.getAttribute('data-modal-target');
        const modal = document.getElementById(targetId);
        if (modal) {
            modal.classList.add('is-open');
        }
    }

    // Close modal
    if (event.target.matches('[data-modal-close], .modal-backdrop')) {
        const modal = event.target.closest('.modal') || document.querySelector('.modal.is-open');
        if (modal) {
            modal.classList.remove('is-open');
        }
    }

    // Open side panel (search, reservations)
    const openPanelBtn = event.target.closest('[data-panel-open]');
    if (openPanelBtn) {
        const targetId = openPanelBtn.getAttribute('data-panel-open');
        const panel = document.getElementById(targetId);
        if (panel) {
            panel.classList.add('is-open');
        }
    }

    // Close side panel
    if (event.target.matches('[data-panel-close], .panel-backdrop')) {
        const panel = event.target.closest('.side-panel') || document.querySelector('.side-panel.is-open');
        if (panel) {
            panel.classList.remove('is-open');
        }
    }
});
</script>
</body>
</html>
