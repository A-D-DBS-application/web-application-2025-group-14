<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Inventory{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Merken</h2>
            <p class="sidebar-subtitle">Selecteer een type om de voorraad te bekijken</p>
        </div>

        {% block sidebar %}
        {% endblock %}
    </aside>

    <main class="main">
        <header class="main-header">
            {% block header %}
            {% endblock %}
        </header>

        <section class="main-content">
            {% block content %}
            {% endblock %}
        </section>
    </main>
</div>
</body>
</html>
