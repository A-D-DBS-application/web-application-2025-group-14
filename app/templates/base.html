<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>{% block title %}Inventory{% endblock %}</title>

    <!-- MATERIAL ICONS (essentieel voor iconen!) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- MAIN STYLESHEET -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="{{ body_class|default('') }}">

<header class="top-header">
    <div class="top-header-inner">

        <!-- LEFT SIDE — USER -->
        <div class="top-header-left">
            Logged in as <strong>{{ session.get('username') }}</strong>
        </div>

        <!-- CENTER — COMPANY -->
        <div class="top-header-center">
            {{ session.get('company_name') }}
        </div>

        <!-- RIGHT SIDE — ICON BAR -->
        <div class="top-header-right">

            <!-- Search -->
            <button class="icon-btn" 
                    data-panel-open="filter-panel"
                    data-fallback-url="{{ url_for('main.inventory', open='filter') }}"
                    title="Search">
                <span class="material-icons">search</span>
            </button>

            <!-- Add item -->
            <a href="{{ url_for('main.add_item') }}" class="icon-btn" title="Add item">
                <span class="material-icons">add</span>
            </a>

            <!-- Reservations / Cart -->
            <button class="icon-btn"
                    data-panel-open="reservations-panel"
                    data-fallback-url="{{ url_for('main.inventory', open='reservations') }}"
                    title="Reservations">
                <span class="material-icons">shopping_cart</span>
            </button>

            <!-- Logout -->
            <a href="{{ url_for('main.logout') }}" class="icon-btn" title="Logout">
                <span class="material-icons">logout</span>
            </a>

        </div>

    </div>
</header>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar {% if body_class == 'no-sidebar' %}hidden{% endif %}">
        {% block sidebar %}{% endblock %}
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main">
        <header class="main-header">
            {% block header %}{% endblock %}
        </header>

        <section class="main-content">
            {% block content %}{% endblock %}
        </section>
    </main>

</div>

<!-- PANEL + INTERACTION SCRIPT -->
<script>
document.addEventListener('click', (event) => {

    // --- TOGGLE "More details" ---
    const toggle = event.target.closest('[data-toggle-details]');
    if (toggle) {
        const id = toggle.getAttribute('data-toggle-details');
        const panel = document.getElementById(id);
        if (panel) {
            const isOpen = panel.classList.toggle('open');
            toggle.textContent = isOpen ? 'Less details' : 'More details';
        }
    }

// --- OPEN SIDE PANEL ---
const openPanelBtn = event.target.closest('[data-panel-open]');
if (openPanelBtn) {
    const targetId = openPanelBtn.getAttribute('data-panel-open');
    const panel = document.getElementById(targetId);

    if (panel) {
        // Panel bestaat → open
        panel.classList.add('is-open');
    } else {
        // Panel bestaat niet → ga naar fallback (bv. inventory)
        const fallbackUrl = openPanelBtn.getAttribute('data-fallback-url');
        if (fallbackUrl) {
            window.location.href = fallbackUrl;
        }
    }
}

// --- CLOSE SIDE PANEL (ORIGINEEL) ---
if (event.target.matches('[data-panel-close], .panel-backdrop')) {
    const panel = event.target.closest('.side-panel') || document.querySelector('.side-panel.is-open');
    if (panel) {
        panel.classList.remove('is-open');
    }
}


    /*  --------------------------------------------------
        (MODAL SCRIPT BEGIN)
        Openen/sluiten van reservations-modals
    -------------------------------------------------- */
    const modalOpenBtn = event.target.closest("[data-modal-target]");
    if (modalOpenBtn) {
        const modalId = modalOpenBtn.getAttribute("data-modal-target");
        const modal = document.getElementById(modalId);
        if (modal) modal.classList.add("is-open");
    }

    // CLOSE MODAL (via kruisje of backdrop)
    if (
        event.target.matches("[data-modal-close]") ||
        event.target.closest("[data-modal-close]")
    ) {
        const modal = event.target.closest(".modal");
        if (modal) modal.classList.remove("is-open");
    }
    /*  ---------------------------
        (MODAL SCRIPT END)
    --------------------------- */

});
</script>

</body>
</html>
