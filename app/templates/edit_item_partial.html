{# Partial used inside the edit item modal (loaded via fetch) #}
<div class="edit-item-content">
    <p style="margin-bottom: 16px; color: #6b7280;">
        <strong style="color: #1e293b;">{{ item.material.brand }} – {{ item.material.material_type }}</strong><br>
        {{ item.material.description }}
    </p>

    {% if error %}
    <div class="flash-message flash-error" style="margin-bottom: 15px; border-radius: 8px;">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" 
          action="{{ url_for('main.edit_item', item_id=item.item_id) }}"
          id="edit-item-form"
          data-item-id="{{ item.item_id }}"
          data-material-brand="{{ item.material.brand }}"
          data-material-type="{{ item.material.material_type }}"
          class="filter-form" 
          style="max-width:400px;">
        <label>
            Zone
            <input
                id="zone_name"
                name="zone_name"
                type="text"
                class="form-input"
                value="{{ item.zone.zone_name }}"
                required
            >
        </label>

        <label>
            Purpose
            <select name="purpose" required>
                <option value="keep"    {% if item.purpose == 'keep' %}selected{% endif %}>keep</option>
                <option value="sell"    {% if item.purpose == 'sell' %}selected{% endif %}>sell</option>
                <option value="dispose" {% if item.purpose == 'dispose' %}selected{% endif %}>dispose</option>
            </select>
        </label>

        <label>
            Packaging
            <select name="packaging" required>
                <option value="open"   {% if item.packaging == 'open' %}selected{% endif %}>open</option>
                <option value="closed" {% if item.packaging == 'closed' %}selected{% endif %}>closed</option>
                <option value="none"   {% if item.packaging == 'none' %}selected{% endif %}>none</option>
            </select>
        </label>

        <label>
            Comment
            <input type="text" name="comment" value="{{ item.display_comment or '' }}">
        </label>

        <div class="filter-actions">
            <button type="submit" class="btn-primary">Save</button>
            <button type="button" class="btn-secondary" onclick="closeEditItemModal(); return false;">Cancel</button>
        </div>
    </form>
</div>
