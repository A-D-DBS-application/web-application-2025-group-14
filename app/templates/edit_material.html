{% extends "base.html" %}
{% block body_class %}has-overlay{% endblock %}

{% block title %}Edit material{% endblock %}

{% block content %}
{# Background inventory content - blurred #}
<div id="inventory-background" style="position: fixed; inset: 0; z-index: 1; filter: blur(4px); pointer-events: none; overflow: hidden; background: #f8fafc;">
    <iframe src="{{ url_for('main.inventory', brand=material.brand, material_id=material.material_id) }}" 
            style="width: 100%; height: 100%; border: none; transform: scale(1.02); transform-origin: top left;"></iframe>
</div>

<div class="return-modal is-open" style="position: fixed; inset: 0; z-index: 1200;">
    <div class="return-backdrop" onclick="window.location.href='{{ url_for('main.inventory', brand=material.brand, material_id=material.material_id) }}'"></div>
    <div class="return-dialog" style="position: relative; z-index: 1201;">
        <div class="modal-header">
            <h2>Edit material</h2>
            <a href="{{ url_for('main.inventory', brand=material.brand, material_id=material.material_id) }}" class="modal-close">×</a>
        </div>
        <div class="modal-body">
            <form method="post" class="filter-form" style="max-width:400px; margin-top: 16px;">
                <label>
                    Brand
                    <input type="text" name="brand" value="{{ material.brand }}" required>
                </label>
                <label>
                    Type
                    <input type="text" name="material_type" value="{{ material.material_type }}" required>
                </label>
                <label>
                    Description
                    <textarea name="description" rows="3" required>{{ material.description }}</textarea>
                </label>
                <label>
                    Lifecycle
                    <input type="text" name="lifecycle" value="{{ material.lifecycle or '' }}">
                </label>
                <label>
                    Price (€)
                    <input type="number" step="0.01" name="price"
                           value="{{ material.price if material.price is not none }}">
                </label>

                <div class="filter-actions" style="display: flex; align-items: center; gap: 8px;">
                    <button type="submit" class="btn-primary">Save</button>
                    <a href="{{ url_for('main.inventory', brand=material.brand, material_id=material.material_id) }}"
                       class="btn-secondary">Cancel</a>
                </div>
            </form>

            <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #e5e7eb;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <form method="post" 
                          action="{{ url_for('main.delete_material', material_id=material.material_id) }}"
                          onsubmit="return confirmDeleteMaterial(event);"
                          style="margin: 0; display: inline;">
                        <button type="submit" 
                                class="btn-secondary"
                                style="background-color: #fef2f2; border-color: #fecaca; color: #991b1b;">
                            Delete
                        </button>
                    </form>
                    <span style="font-size: 13px; color: #6b7280;">Delete this material and all its items.</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function confirmDeleteMaterial(event) {
    if (!confirm('Are you sure you want to delete this material and all its items? This action cannot be undone.')) {
        event.preventDefault();
        return false;
    }
    return true;
}
document.addEventListener("DOMContentLoaded", function() {
    // Add a style tag for the autofill class
    const style = document.createElement('style');
    style.innerHTML = `.autofilled { background-color: #f2f2f2 !important; }`;
    document.head.appendChild(style);

    // --- AUTO-FILL MATERIAL DETAILS ---
    const brandInput = document.querySelector('input[name="brand"]');
    const typeInput = document.querySelector('input[name="material_type"]');
    const descInput = document.querySelector('textarea[name="description"]');
    const priceInput = document.querySelector('input[name="price"]');
    const lifecycleInput = document.querySelector('input[name="lifecycle"]');

    const autofillElements = [descInput, priceInput, lifecycleInput];

    function setAutofilled(element, value) {
        if (element.value !== value) {
            element.value = value;
        }
        element.classList.add('autofilled');
        
        element.addEventListener('input', function onFirstInput() {
            element.classList.remove('autofilled');
            element.removeEventListener('input', onFirstInput);
        }, { once: true });
    }

    function clearAutofilled(elements) {
        elements.forEach(el => {
            if (el.classList.contains('autofilled')) {
                el.value = '';
                el.classList.remove('autofilled');
            }
        });
    }

    async function fetchMaterialDetails() {
        const brand = brandInput.value.trim();
        const type = typeInput.value.trim();
        const materialId = "{{ material.material_id }}";

        if (!brand || !type) {
            clearAutofilled(autofillElements);
            return;
        }

        try {
            const params = new URLSearchParams({ brand, type, exclude_id: materialId });
            const response = await fetch(`/material_details?${params.toString()}`);
            
            if (!response.ok) {
                clearAutofilled(autofillElements);
                return;
            }

            const data = await response.json();

            if (data && data.description) {
                setAutofilled(descInput, data.description || '');
                setAutofilled(priceInput, data.price || '');
                setAutofilled(lifecycleInput, data.lifecycle || '');
            } else {
                clearAutofilled(autofillElements);
            }
        } catch (error) {
            console.error('Error fetching material details:', error);
            clearAutofilled(autofillElements);
        }
    }

    brandInput.addEventListener('input', fetchMaterialDetails);
    typeInput.addEventListener('input', fetchMaterialDetails);
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('.filter-form');
    if (!form) return;
    
    // Set custom English validation messages for all required fields
    const requiredFields = form.querySelectorAll('input[required], textarea[required]');
    
    requiredFields.forEach(function(field) {
        // Set custom message
        field.addEventListener('invalid', function(e) {
            e.preventDefault();
            if (this.validity.valueMissing) {
                this.setCustomValidity('Please fill in this field.');
            } else {
                this.setCustomValidity('');
            }
            // Show the validation message
            this.reportValidity();
        });
        
        // Clear custom message when user starts typing
        field.addEventListener('input', function() {
            this.setCustomValidity('');
        });
    });
    
    // Handle form submission
    form.addEventListener('submit', function(e) {
        if (!form.checkValidity()) {
            e.preventDefault();
            // Find first invalid field and show its message
            const firstInvalid = form.querySelector(':invalid');
            if (firstInvalid) {
                firstInvalid.focus();
                firstInvalid.reportValidity();
            }
        }
    });
});
</script>
{% endblock %}
