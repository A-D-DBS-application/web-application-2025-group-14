{# Partial used inside the add item modal (loaded via fetch) #}
<div class="add-item-content">
    <form method="post" 
          action="{{ url_for('main.add_item') }}"
          id="add-item-form"
          class="add-item-form">
        <!-- ===== MATERIAL ===== -->
        <section class="form-section">
            <h2 class="section-title">Material</h2>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="brand">Brand</label>
                    <input type="text" id="brand" name="brand" required>
                    <div id="brand_suggestions" 
                         style="color:#666; font-size:0.9em; margin-top:4px;"></div>
                </div>

                <div class="form-group">
                    <label for="material_type">Type</label>
                    <input type="text" id="material_type" name="material_type" required>
                </div>

                <div class="form-group full-width">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="price">Price (€)</label>
                    <input type="number" 
                           id="price" 
                           name="price" 
                           step="0.01" 
                           placeholder="e.g. 12.50">
                    <div id="price-error" class="field-error" style="display: none; color: #dc2626; font-size: 13px; margin-top: 4px;">
                        Price must be greater than or equal to 0
                    </div>
                </div>

                <div class="form-group">
                    <label for="lifecycle">Lifecycle</label>
                    <input type="text" id="lifecycle" name="lifecycle" placeholder="e.g. Active, Obsolete…">
                </div>
            </div>
        </section>

        <!-- ===== INVENTORY ITEM ===== -->
        <section class="form-section">
            <h2 class="section-title">Inventory item</h2>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" min="0" required>
                    <div id="quantity-error" class="field-error" style="display: none; color: #dc2626; font-size: 13px; margin-top: 4px;">
                        Quantity must be positive
                    </div>
                </div>

                <div class="form-group">
                    <label for="zone_name">Zone</label>
                    <input type="text" id="zone_name" name="zone_name" maxlength="3" placeholder="e.g. 26B" required>
                </div>

                <div class="form-group">
                    <label for="purpose">Purpose</label>
                    <select id="purpose" name="purpose" required>
                        <option value="" disabled selected>Select purpose</option>
                        <option value="keep">keep</option>
                        <option value="sell">sell</option>
                        <option value="dispose">dispose</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="packaging">Packaging</label>
                    <select id="packaging" name="packaging" required>
                        <option value="" disabled selected>Select packaging</option>
                        <option value="open">open</option>
                        <option value="closed">closed</option>
                        <option value="none">none</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="comment">Comment</label>
                    <textarea id="comment" name="comment" rows="4"></textarea>
                </div>
            </div>
        </section>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Add item</button>
            <button type="button" class="btn-secondary" onclick="closeAddItemModal()">Cancel</button>
        </div>
    </form>
</div>

<script>
// Initialize brand suggestions when modal content is loaded
(function() {
    const brandInput = document.getElementById("brand");
    if (brandInput) {
        brandInput.addEventListener("input", function () {
            const q = this.value.trim();
            const box = document.getElementById("brand_suggestions");

            if (q.length === 0) {
                box.innerHTML = "";
                return;
            }

            fetch(`/brand_suggest?q=${encodeURIComponent(q)}`)
                .then(r => r.json())
                .then(data => {
                    if (!data.suggestions.length) {
                        box.innerHTML = "";
                        return;
                    }

                    box.innerHTML = data.suggestions
                        .map(s => `<div class="suggestion" style="cursor:pointer;">${s}</div>`)
                        .join("");

                    document.querySelectorAll(".suggestion").forEach(el => {
                        el.onclick = () => {
                            document.getElementById("brand").value = el.textContent;
                            box.innerHTML = "";
                        };
                    });
                });
        });
    }
    
    // Price validation - handle entirely in JavaScript to avoid browser's Dutch message
    const priceInput = document.getElementById("price");
    const priceError = document.getElementById("price-error");
    
    if (priceInput && priceError) {
        // Always clear custom validity initially
        priceInput.setCustomValidity("");
        
        // Validate on input
        priceInput.addEventListener("input", function() {
            const value = parseFloat(this.value);
            if (this.value !== "" && (isNaN(value) || value < 0)) {
                priceError.style.display = "block";
                this.setCustomValidity("Price must be greater than or equal to 0");
            } else {
                priceError.style.display = "none";
                this.setCustomValidity("");
            }
        });
        
        // Validate on blur
        priceInput.addEventListener("blur", function() {
            const value = parseFloat(this.value);
            if (this.value !== "" && (isNaN(value) || value < 0)) {
                priceError.style.display = "block";
                this.setCustomValidity("Price must be greater than or equal to 0");
            } else {
                priceError.style.display = "none";
                this.setCustomValidity("");
            }
        });
        
        // Prevent form submission with negative price
        const form = document.getElementById("add-item-form");
        if (form) {
            form.addEventListener("submit", function(e) {
                const value = parseFloat(priceInput.value);
                if (priceInput.value !== "" && (isNaN(value) || value < 0)) {
                    e.preventDefault();
                    priceError.style.display = "block";
                    priceInput.setCustomValidity("Price must be greater than or equal to 0");
                    priceInput.focus();
                    // Don't call reportValidity() to avoid browser's native message
                    return false;
                }
                // Clear any custom validity if valid
                priceInput.setCustomValidity("");
            });
        }
    }
    
    // Quantity validation and conditional fields
    const quantityInput = document.getElementById("quantity");
    const quantityError = document.getElementById("quantity-error");
    const zoneInput = document.getElementById("zone_name");
    const purposeSelect = document.getElementById("purpose");
    const packagingSelect = document.getElementById("packaging");

    if (quantityInput) {
        // Logic for conditional fields based on quantity
        if (zoneInput && purposeSelect && packagingSelect) {
            const itemFields = [zoneInput, purposeSelect, packagingSelect];
            const itemFieldGroups = itemFields.map(el => el ? el.closest('.form-group') : null);

            const updateItemFieldsState = () => {
                const isZero = quantityInput.value === '0';
                itemFields.forEach(el => {
                    if (el) {
                        el.required = !isZero;
                        el.disabled = isZero;
                    }
                });
                itemFieldGroups.forEach(el => {
                    if (el) el.style.opacity = isZero ? '0.5' : '1';
                });
            };

            quantityInput.addEventListener('input', updateItemFieldsState);
            updateItemFieldsState(); // Set initial state on load
        }

        // Validation logic for the quantity field itself
        if (quantityError) {
            quantityInput.addEventListener("invalid", function(e) {
                e.preventDefault(); // Stop browser's default validation message
                if (this.validity.rangeUnderflow) {
                    this.setCustomValidity("Quantity must be positive");
                    quantityError.style.display = "block";
                }
                // We can use requestAnimationFrame to ensure our custom message UI updates smoothly
                requestAnimationFrame(() => this.reportValidity());
            });
            
            quantityInput.addEventListener("input", function() {
                const value = parseInt(this.value);
                if (this.value !== "" && (isNaN(value) || value < 0)) {
                    quantityError.style.display = "block";
                    this.setCustomValidity("Quantity must be positive");
                } else {
                    quantityError.style.display = "none";
                    this.setCustomValidity(""); // Clear custom validity when the value is valid
                }
            });
        }
    }
})();
</script>
