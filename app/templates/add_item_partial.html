{# Partial used inside the add item modal (loaded via fetch) #}
<div class="add-item-content">
    <form method="post" 
          action="{{ url_for('main.add_item') }}"
          id="add-item-form"
          class="add-item-form">
        <!-- ===== MATERIAL ===== -->
        <section class="form-section">
            <h2 class="section-title">Material</h2>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="brand">Brand</label>
                    <input type="text" id="brand" name="brand" required>
                    <div id="brand_suggestions" 
                         style="color:#666; font-size:0.9em; margin-top:4px;"></div>
                </div>

                <div class="form-group">
                    <label for="material_type">Type</label>
                    <input type="text" id="material_type" name="material_type" required>
                </div>

                <div class="form-group full-width">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4" required>{{ description or '' }}</textarea>
                </div>

                <div class="form-group">
                    <label for="price">Price (€)</label>
                    <input type="number" 
                           id="price" 
                           name="price" 
                           step="0.01" 
                           placeholder="e.g. 12,50">
                    <div id="price-error" class="field-error" style="display: none; color: #dc2626; font-size: 13px; margin-top: 4px;">
                        Price must be greater than or equal to 0
                    </div>
                </div>

                <div class="form-group">
                    <label for="lifecycle">Lifecycle</label>
                    <input type="text" id="lifecycle" name="lifecycle" placeholder="e.g. (un)available">
                </div>
            </div>
        </section>

        <!-- ===== INVENTORY ITEM ===== -->
        <section class="form-section">
            <h2 class="section-title">Inventory item</h2>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" min="0" required>
                    <div id="quantity-error" class="field-error" style="display: none; color: #dc2626; font-size: 13px; margin-top: 4px;">
                        Quantity must be positive
                    </div>
                </div>

                <div class="form-group">
                    <label for="zone_name">Zone</label>
                    <input type="text" id="zone_name" name="zone_name" maxlength="3" placeholder="e.g. 26B" required>
                </div>

                <div class="form-group">
                    <label for="purpose">Purpose</label>
                    <select id="purpose" name="purpose" required>
                        <option value="" disabled selected>Select purpose</option>
                        <option value="keep">keep</option>
                        <option value="sell">sell</option>
                        <option value="dispose">dispose</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="packaging">Packaging</label>
                    <select id="packaging" name="packaging" required>
                        <option value="" disabled selected>Select packaging</option>
                        <option value="open">open</option>
                        <option value="closed">closed</option>
                        <option value="none">none</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="comment">Comment</label>
                    <textarea id="comment" name="comment" rows="4"></textarea>
                </div>
            </div>
        </section>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Add item</button>
            <button type="button" class="btn-secondary" onclick="closeAddItemModal()">Cancel</button>
        </div>
    </form>
</div>

<script>
// Self-executing anonymous function to avoid polluting the global scope.
// This script is now encapsulated with its HTML partial.
(function() {
    // Add a style tag for the autofill class, if it doesn't exist
    if (!document.querySelector('[data-autofill-style]')) {
        const style = document.createElement('style');
        style.setAttribute('data-autofill-style', 'true'); // marker to prevent duplicates
        style.innerHTML = `.autofilled { background-color: #f2f2f2 !important; }`;
        document.head.appendChild(style);
    }

    // --- GET ALL ELEMENTS ---
    const form = document.getElementById("add-item-form");
    if (!form) return;

    const brandInput = form.querySelector("#brand");
    const brandSuggestionsBox = form.querySelector("#brand_suggestions");
    const typeInput = form.querySelector('#material_type');
    const descInput = form.querySelector('#description');
    const priceInput = form.querySelector('#price');
    const lifecycleInput = form.querySelector('#lifecycle');
    const commentInput = form.querySelector('#comment');
    const zoneInput = form.querySelector('#zone_name');
    const purposeInput = form.querySelector('#purpose');
    const packagingInput = form.querySelector('#packaging');
    const quantityInput = form.querySelector('#quantity');

    priceInput.setAttribute('min', '0');

    // --- BRAND SUGGESTIONS ---
    brandInput.addEventListener("input", function () {
        const q = this.value.trim();
        if (q.length === 0) {
            brandSuggestionsBox.innerHTML = "";
            return;
        }

        fetch(`/brand_suggest?q=${encodeURIComponent(q)}`)
            .then(r => r.json())
            .then(data => {
                if (!data.suggestions.length) {
                    brandSuggestionsBox.innerHTML = "";
                    return;
                }
                brandSuggestionsBox.innerHTML = data.suggestions
                    .map(s => `<div class="suggestion" style="cursor:pointer; padding: 2px 0;">${s}</div>`)
                    .join("");

                brandSuggestionsBox.onclick = (event) => {
                    const suggestion = event.target.closest('.suggestion');
                    if (suggestion) {
                        brandInput.value = suggestion.textContent;
                        brandSuggestionsBox.innerHTML = "";
                        brandInput.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                };
            });
    });

    // --- AUTO-FILL LOGIC ---
    const materialAutofillElements = [descInput, priceInput, lifecycleInput];
    const itemAutofillElements = [commentInput];

    function setAutofilled(element, value) {
        if (element.value !== value) { element.value = value; }
        element.classList.add('autofilled');
        element.addEventListener('input', function onFirstInput() {
            element.classList.remove('autofilled');
            element.removeEventListener('input', onFirstInput);
        }, { once: true });
    }

    function clearAutofilled(elements) {
        elements.forEach(el => {
            if (el && el.classList.contains('autofilled')) {
                el.value = '';
                el.classList.remove('autofilled');
            }
        });
    }

    async function fetchMaterialDetails() {
        const brand = brandInput.value.trim();
        const type = typeInput.value.trim();
        if (!brand || !type) { clearAutofilled(materialAutofillElements); return; }
        try {
            const response = await fetch(`/material_details?brand=${encodeURIComponent(brand)}&type=${encodeURIComponent(type)}`);
            if (!response.ok) { clearAutofilled(materialAutofillElements); return; }
            const data = await response.json();
            if (data && data.description) {
                setAutofilled(descInput, data.description || '');
                setAutofilled(priceInput, data.price || '');
                setAutofilled(lifecycleInput, data.lifecycle || '');
            } else { clearAutofilled(materialAutofillElements); }
        } catch (error) { console.error('Error fetching material details:', error); clearAutofilled(materialAutofillElements); }
    }

    async function fetchItemDetails() {
        const params = new URLSearchParams({ brand: brandInput.value.trim(), type: typeInput.value.trim(), zone: zoneInput.value.trim(), purpose: purposeInput.value, packaging: packagingInput.value });
        if (!params.get('brand') || !params.get('type') || !params.get('zone') || !params.get('purpose') || !params.get('packaging')) { clearAutofilled(itemAutofillElements); return; }
        try {
            const response = await fetch(`/item_details?${params.toString()}`);
            if (!response.ok) { clearAutofilled(itemAutofillElements); return; }
            const data = await response.json();
            if (data && data.comment) { setAutofilled(commentInput, data.comment); } else { clearAutofilled(itemAutofillElements); }
        } catch (error) { console.error('Error fetching item details:', error); clearAutofilled(itemAutofillElements); }
    }

    // Add event listeners
    brandInput.addEventListener('input', fetchMaterialDetails);
    typeInput.addEventListener('input', fetchMaterialDetails);
    brandInput.addEventListener('input', fetchItemDetails);
    typeInput.addEventListener('input', fetchItemDetails);
    zoneInput.addEventListener('input', fetchItemDetails);
    purposeInput.addEventListener('change', fetchItemDetails);
    packagingInput.addEventListener('change', fetchItemDetails);

    // --- CONDITIONAL REQUIRED FIELDS ---
    // Makes item-specific fields (zone, purpose, packaging) optional if quantity is 0.
    const requiredFields = [zoneInput, purposeInput, packagingInput];
    const allConditionalFields = [zoneInput, purposeInput, packagingInput, commentInput];
    const fieldGroups = allConditionalFields.map(el => el ? el.closest('.form-group') : null);

    const updateItemFieldsState = () => {
        const isZero = quantityInput.value === '0';
        fieldGroups.forEach(group => { if (group) group.style.opacity = isZero ? '0.5' : '1'; });
        allConditionalFields.forEach(field => { if (field) field.disabled = isZero; });
        requiredFields.forEach(field => { if (field) field.required = !isZero; });
    };

    quantityInput.addEventListener('input', updateItemFieldsState);
    updateItemFieldsState(); // Set initial state on load

    // --- VALIDATION ---
    const fieldsToValidate = form.querySelectorAll('input, select, textarea');
    fieldsToValidate.forEach(function(field) {
        field.addEventListener('invalid', function() {
            if (this.validity.valueMissing) {
                this.setCustomValidity(this.tagName.toLowerCase() === 'select' ? 'Select an option.' : 'Fill in this field.');
            } else if (this.validity.rangeUnderflow) {
                this.setCustomValidity('Invalid input.');
            } else {
                this.setCustomValidity('');
            }
        });
        field.addEventListener('input', function() { this.setCustomValidity(''); });
    });

    form.addEventListener('submit', function(e) {
        if (form.checkValidity()) return;
        e.preventDefault();
        const fieldOrder = ['brand', 'material_type', 'description', 'quantity', 'zone_name', 'purpose', 'packaging'];
        for (const fieldName of fieldOrder) {
            const field = form.querySelector(`[name="${fieldName}"]`);
            if (field && !field.checkValidity()) {
                field.focus();
                field.reportValidity();
                return;
            }
        }
        const firstInvalid = form.querySelector(':invalid');
        if (firstInvalid) {
            firstInvalid.focus();
            firstInvalid.reportValidity();
        }
    });
})();
</script>
